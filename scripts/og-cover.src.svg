  <text x="322" y="536" font-family="'JetBrains Mono', monospace" font-size="19" letter-spacing="2" fill="#7A736A">·</text>
  <text x="352" y="536" font-family="'JetBrains Mono', monospace" font-size="19" letter-spacing="2" fill="#A65A3F">GLOBAL GROWTH</text>
  <text x="648" y="536" font-family="'JetBrains Mono', monospace" font-size="19" letter-spacing="2" fill="#7A736A">·</text>
  <text x="678" y="536" font-family="'JetBrains Mono', monospace" font-size="19" letter-spacing="2" fill="#A65A3F">PMM</text>

